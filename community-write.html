<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>글쓰기 - 게임 커뮤니티</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="container nav">
<a class="brand" href="index.html"><div class="logo">🎮</div><div><div class="brand-title">게임 발견 플랫폼</div><div class="brand-sub">커뮤니티 글쓰기</div></div></a>
<nav class="menu"><a href="index.html">홈</a><a href="category.html">카테고리</a><a href="index.html#popular">인기 게임</a><a class="active" href="community.html">커뮤니티</a></nav>
</div></header>
<main class="container board-wrap">
<div class="board-title-row"><div><h1>글쓰기</h1><p>다른 게이머들과 정보를 공유해보세요.</p></div></div>
<form class="write-form" id="writeForm">
  <div class="form-group"><label for="author">작성자</label><input id="author" maxlength="20" value="익명" required></div>
  <div class="form-group"><label for="title">제목</label><input id="title" maxlength="100" placeholder="제목을 입력하세요" required></div>
  <div class="form-group"><label for="content">내용</label><textarea id="content" placeholder="내용을 입력하세요" required></textarea></div>
  <div class="form-actions"><a class="btn" href="community.html">취소</a><button class="btn primary" type="submit">등록</button></div>
</form>
</main>
<script src="community-data.js"></script>
<script>
document.getElementById("writeForm").addEventListener("submit",e=>{
  e.preventDefault();
  const posts=loadCommunityPosts();
  const post={
    id:nextPostId(posts),notice:false,
    title:document.getElementById("title").value.trim(),
    author:document.getElementById("author").value.trim()||"익명",
    date:todayCommunity(),views:0,recs:0,
    content:document.getElementById("content").value.trim(),comments:[]
  };
  if(!post.title||!post.content)return;
  posts.push(post);saveCommunityPosts(posts);
  location.href="community-post.html?id="+post.id;
});
</script>
</body></html>
