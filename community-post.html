<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>게시글 - 게임 커뮤니티</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="container nav">
<a class="brand" href="index.html"><div class="logo">🎮</div><div><div class="brand-title">게임 발견 플랫폼</div><div class="brand-sub">커뮤니티 게시글</div></div></a>
<nav class="menu"><a href="index.html">홈</a><a href="category.html">카테고리</a><a href="index.html#popular">인기 게임</a><a class="active" href="community.html">커뮤니티</a></nav>
</div></header>
<main class="container board-wrap">
<a class="back" href="community.html">← 게시판으로</a>
<div id="postRoot"></div>
</main>
<script src="community-data.js"></script>
<script>
const id=Number(new URLSearchParams(location.search).get("id"));
let posts=loadCommunityPosts();
let post=posts.find(p=>Number(p.id)===id)||posts[0];
post.views=(post.views||0)+1;saveCommunityPosts(posts);

function render(){
  document.title=post.title+" - 게임 커뮤니티";
  const root=document.getElementById("postRoot");
  const comments=(post.comments||[]).map(c=>`
    <div class="comment"><div class="comment-top"><span class="comment-author">${c.author}</span><span>${c.date}</span></div><div class="comment-body">${c.text}</div></div>
  `).join("");
  root.innerHTML=`
    <article class="post-box">
      <div class="post-head"><h1>${post.title}</h1><div class="post-meta"><span>작성자 ${post.author}</span><span>${post.date}</span><span>조회 ${post.views}</span><span>추천 ${post.recs||0}</span></div></div>
      <div class="post-content">${post.content}</div>
      <div class="post-vote"><button class="vote-btn" id="recommendPost" type="button">추천<strong>${post.recs||0}</strong></button></div>
    </article>
    <section class="comments"><h2>댓글 ${(post.comments||[]).length}</h2><div id="commentList">${comments||'<div class="comment"><div class="comment-body" style="color:#8597ad">아직 댓글이 없습니다.</div></div>'}</div>
      <form class="comment-form" id="commentForm"><input id="commentInput" maxlength="300" placeholder="댓글을 입력하세요"><button class="btn primary" type="submit">등록</button></form>
    </section>`;
  document.getElementById("recommendPost").onclick=()=>{
    post.recs=(post.recs||0)+1;saveCommunityPosts(posts);render();
  };
  document.getElementById("commentForm").onsubmit=e=>{
    e.preventDefault();const input=document.getElementById("commentInput");const text=input.value.trim();if(!text)return;
    post.comments=post.comments||[];post.comments.push({author:"익명",text,date:todayCommunity()});saveCommunityPosts(posts);render();
  };
}
render();
</script>
</body></html>
