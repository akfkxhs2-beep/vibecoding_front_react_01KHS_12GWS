<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>게임 상세</title><link rel="stylesheet" href="style.css"><style>
main{padding:32px 0 54px}.back{display:inline-flex;margin-bottom:18px;color:#b2c0d1;font-size:13px;font-weight:850}.hero-detail{display:grid;grid-template-columns:minmax(340px,510px) 1fr;gap:28px}.big-image{min-height:390px;border:1px solid #35445d;border-radius:20px;overflow:hidden;position:relative;background:#101b2b}.big-image img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.info{border:1px solid #263851;border-radius:20px;background:linear-gradient(180deg,#0e1a2b,#0a1422);padding:29px}.eyebrow{font-size:11px;color:#8799b0;font-weight:900}h1{font-size:42px;line-height:1.08;letter-spacing:-1.6px;margin-top:8px}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:22px 0}.score{border:1px solid #31445e;background:#111f32;border-radius:14px;padding:14px}.score label{display:block;font-size:10px;color:#91a2b7;font-weight:900;margin-bottom:7px}.score strong{font-size:26px}.green{color:#7bf1a8}.yellow{color:#ffd76c}.blue{color:#78dfff}.genres{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:22px}.description{color:#b9c5d4;font-size:14px;line-height:1.75}.description-title{font-weight:950;margin-bottom:8px}
.price-section{margin-top:30px}.price-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}.price-head h2{font-size:25px}.price-head span{font-size:11px;color:#8495aa}.price-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.store-card{border:1px solid #2a3d57;border-radius:16px;padding:20px;background:linear-gradient(180deg,#101e30,#0b1624)}.store-card.best{border-color:#7664d0}.store-top{display:flex;justify-content:space-between;align-items:center}.store-name{font-size:18px;font-weight:950}.badge{font-size:10px;border-radius:999px;padding:5px 8px;background:#1d2e44;color:#afc4dd}.price{font-size:31px;font-weight:950;margin-top:17px}.old{height:18px;color:#8291a4;text-decoration:line-through;font-size:13px}.sale{height:20px;color:#77ecab;font-size:13px;font-weight:900}.store-card .btn{width:100%;margin-top:14px}.note{font-size:11px;color:#7d8fa6;line-height:1.65;margin-top:12px}
@media(max-width:920px){.hero-detail{grid-template-columns:1fr}.big-image{min-height:320px;aspect-ratio:460/215}}@media(max-width:620px){h1{font-size:34px}.info{padding:20px}.scores,.price-grid{grid-template-columns:1fr}}

.steam-price-box{
  margin-top:18px;display:inline-flex;align-items:stretch;overflow:hidden;border-radius:4px;
  background:#16324b;border:1px solid rgba(255,255,255,.04)
}
.discount-box{
  min-width:72px;display:flex;align-items:center;justify-content:center;
  padding:9px 10px;background:#a4d007;color:#0c2538;font-size:20px;font-weight:950
}
.price-stack{
  min-width:128px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;
  padding:6px 10px;background:#18364f
}
.price-stack .was{
  color:#7991a5;text-decoration:line-through;font-size:12px;line-height:1.1
}
.price-stack .now{
  color:#d7f4ff;font-size:18px;font-weight:950;line-height:1.25
}
.price-regular{
  margin-top:18px;display:inline-flex;align-items:center;padding:10px 13px;
  background:#18364f;border-radius:4px;color:#d7f4ff;font-size:20px;font-weight:950
}
.store-sub{
  color:#8196aa;font-size:11px;margin-top:8px
}


/* ===== 게임 미디어 갤러리 ===== */
.media-gallery{
  min-width:0;
}
.media-stage{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  overflow:hidden;
  border:1px solid #35445d;
  border-radius:20px;
  background:#050b13;
  box-shadow:0 16px 40px rgba(0,0,0,.22);
}
.media-stage img,
.media-stage video,
.media-stage iframe{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
}
.media-stage img{object-fit:cover}
.media-stage video{object-fit:contain;background:#000}
.media-stage iframe{background:#000}
.media-fallback{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;padding:25px;text-align:center;background:linear-gradient(135deg,#101f35,#2a2250);
  color:#dce6f3;font-weight:900
}
.media-fallback small{color:#91a4bb;font-weight:600}
.media-topbar{
  position:absolute;left:12px;top:12px;z-index:6;display:flex;gap:7px;align-items:center
}
.media-type{
  display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;
  background:rgba(5,11,19,.78);border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(8px);font-size:11px;font-weight:900
}
.media-arrow{
  position:absolute;top:50%;z-index:7;transform:translateY(-50%);
  width:42px;height:52px;border:1px solid rgba(255,255,255,.14);border-radius:10px;
  background:rgba(3,8,15,.68);color:#fff;font-size:24px;cursor:pointer;
  opacity:.2;transition:.18s
}
.media-stage:hover .media-arrow{opacity:1}
.media-prev{left:10px}.media-next{right:10px}
.media-bottom{
  margin-top:10px;display:flex;justify-content:space-between;gap:10px;align-items:center
}
.media-caption{font-size:12px;color:#a5b4c7;font-weight:800;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.media-counter{font-size:11px;color:#7f92aa;white-space:nowrap}
.media-thumbs{
  margin-top:11px;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(105px,1fr);
  gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin
}
.media-thumb{
  position:relative;height:67px;overflow:hidden;border-radius:9px;border:1px solid #2e425c;
  background:#101b2a;cursor:pointer;padding:0;min-width:105px
}
.media-thumb img{width:100%;height:100%;object-fit:cover;display:block;opacity:.72;transition:.18s}
.media-thumb:hover img,.media-thumb.active img{opacity:1}
.media-thumb.active{border-color:#9b7cff;box-shadow:0 0 0 2px rgba(124,77,255,.22)}
.thumb-video-icon{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  background:rgba(3,8,15,.78);border:1px solid rgba(255,255,255,.35);
  font-size:13px;color:#fff
}
.thumb-label{
  position:absolute;left:5px;right:5px;bottom:4px;padding:2px 4px;border-radius:4px;
  background:rgba(2,7,13,.72);font-size:8px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.video-external{
  position:absolute;right:12px;bottom:12px;z-index:8;
  padding:7px 10px;border-radius:7px;background:rgba(5,11,19,.80);
  border:1px solid rgba(255,255,255,.16);font-size:10px;font-weight:850;color:#d8e6f5
}
.media-source-note{
  margin-top:7px;color:#71849b;font-size:10px;line-height:1.5
}
@media(max-width:920px){
  .media-gallery{max-width:760px;margin:auto}
}
